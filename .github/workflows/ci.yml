name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    runs-on: ubuntu-latest
    container: ros:${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/ros2-robot-intrusion-detection

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.distro }}

      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
